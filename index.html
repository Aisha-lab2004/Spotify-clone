<div class="actions">
  <button class="create-playlist" id="playlistBtn">
    + Create Playlist
  </button>
</div>

      <a href="#" class="footer-link">Cookies</a>
      <a href="#" class="footer-link">Privacy</a>
      <button class="lang-btn">English ⌄</button>
    </footer>

  <!-- Main Section -->
  <main class="main">
    <header class="topbar">
     

      <div class="topbar-actions" id="topbarActions">
    <button class="signup-btn" onclick="window.location='signup.html'">Sign up</button>
    <button class="login-btn" onclick="window.location='login.html'">Log in</button>
</div>
    </header>

    <h1>Spotify Playlist</h1>

  

<div id="searchSection" style="display: none; margin: 20px 0;">
  <input
    type="text"
    id="searchInput"
    placeholder="Search songs..."
    style="width:100%; padding:12px; border-radius:20px; border:none; outline:none;"
  >
</div>


    <!-- Song Cards Container -->
    <div class="song-container" id="songContainer"></div>

  </main>
    <!-- Simple Bottom Music Player -->


<!-- Music Player Bar -->
<div class="music-player">
  <button class="player-btn" id="prev" title="Previous">&#9664;&#9664;</button>

<button class="player-btn play" id="play" title="Play/Pause">&#9654;</button>

<button class="player-btn" id="next" title="Next">&#9654;&#9654;</button>

  <!-- <button class="player-btn" title="Previous">&#9664;&#9664;</button>
  <button class="player-btn play" title="Play/Pause">&#9654;</button>
  <button class="player-btn" title="Next">&#9654;&#9654;</button> -->

  <input type="range" class="seek-bar" value="0" max="100">

  <div class="volume-control">
    <span class="volume-icon"></span>
    <span class="current-time">0:00</span>
<span class="total-time">0:00</span>

    <input type="range" class="volume-slider" min="0" max="100" value="50">
  </div>
</div>
