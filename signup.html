<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify - Sign Up</title>

<link rel="stylesheet" href="style.css">

<style>
body{
    background:#121212;
    color:#fff;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.form-box{
    width:380px;
    background:#181818;
    padding:30px;
    border-radius:10px;
}

h2{
    text-align:center;
    color:#1DB954;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:5px;
    background:#2a2a2a;
    color:#fff;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:30px;
    background:#1DB954;
    color:#fff;
    font-size:18px;
    cursor:pointer;
}

a{
    color:#1DB954;
}
</style>

</head>
<body>

<div class="form-box">

<h2>Create Account</h2>

<form id="signupForm" autocomplete="off">

<input type="text" id="name" placeholder="Enter Your Name" autocomplete="off" readonly onfocus="this.removeAttribute('readonly');" required>
<div style="color: #b3b3b3; font-size: 11px; margin: -5px 0 10px 5px; text-align: left;">Enter your first and last name.</div>

<input type="email" id="email" placeholder="Enter Your Email" autocomplete="off" readonly onfocus="this.removeAttribute('readonly');" required>
<div style="color: #b3b3b3; font-size: 11px; margin: -5px 0 10px 5px; text-align: left;">Email should be a valid email format (e.g. user@example.com).</div>

<input type="password" id="password" placeholder="Enter Your Password" autocomplete="off" minlength="6" readonly onfocus="this.removeAttribute('readonly');" required>
<div style="color: #b3b3b3; font-size: 11px; margin: -5px 0 10px 5px; text-align: left;">Must be at least 6 characters long (numbers or letters).</div>

<div style="display: flex; align-items: center; gap: 8px; margin: 15px 0 10px; color: #b3b3b3; font-size: 14px;">
  <input type="checkbox" id="isAdmin" style="width: auto; margin: 0; cursor: pointer;">
  <label for="isAdmin" style="cursor: pointer;">Register as Admin</label>
</div>

<button type="submit">Sign Up</button>

</form>

<p style="text-align:center;margin-top:20px;">
Already have an account?
<a href="login.html">Login</a>
</p>

</div>

<script>

function showToast(message, isError = false) {
  let toastEl = document.getElementById("toastNotification");
  if (!toastEl) {
    toastEl = document.createElement("div");
    toastEl.id = "toastNotification";
    toastEl.className = "toast";
    document.body.appendChild(toastEl);
  }
  toastEl.innerText = message;
  if (isError) {
    toastEl.classList.add("error");
  } else {
    toastEl.classList.remove("error");
  }
  toastEl.classList.add("show");
  setTimeout(() => {
    toastEl.classList.remove("show");
  }, 3000);
}

document.getElementById("signupForm").addEventListener("submit",async(e)=>{

e.preventDefault();

const user={
name:document.getElementById("name").value,
email:document.getElementById("email").value,
password:document.getElementById("password").value,
isAdmin:document.getElementById("isAdmin").checked
};

try {
  const res=await fetch("/signup",{

  method:"POST",

  headers:{
  "Content-Type":"application/json"
  },

  body:JSON.stringify(user)

  });

  const data=await res.json();

  if(res.ok){
    showToast("Sign up successful!", false);
    setTimeout(() => {
      window.location.href="login.html";
    }, 1500);
  } else {
    showToast(data.message || "Sign up failed.", true);
  }
} catch (err) {
  showToast("Network error. Please try again.", true);
}

});

</script>

</body>
</html>
